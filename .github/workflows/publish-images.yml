name: Publish release images

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  changes:
    name: Detect image changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      scraper: ${{ steps.filter.outputs.scraper }}
    steps:
      - name: Check out the release commit and its history
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Find the previous release tag
        id: previous-release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          previous_tag="$(git describe --tags --abbrev=0 "${RELEASE_TAG}^" 2>/dev/null || true)"
          if [ -n "$previous_tag" ]; then
            echo "base=$previous_tag" >> "$GITHUB_OUTPUT"
          else
            # Compare the first release against an empty tree so every image is built.
            echo "base=$(git hash-object -t tree /dev/null)" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect changes to Docker build inputs
        id: filter
        uses: dorny/paths-filter@v4
        with:
          base: ${{ steps.previous-release.outputs.base }}
          ref: ${{ github.event.release.tag_name }}
          filters: |
            frontend:
              - 'apps/frontend/**'
              - 'packages/shared/db/**'
              - 'packages/shared/domain-model/**'
              - 'packages/shared/utils/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
            scraper:
              - 'apps/grocery-scraper/**'
              - 'packages/shared/db/**'
              - 'packages/shared/domain-model/**'
              - 'packages/shared/utils/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'

  publish:
    name: Publish ${{ matrix.image }}
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: grocery-tracker-frontend
            dockerfile: apps/frontend/Dockerfile
            changed: ${{ needs.changes.outputs.frontend }}
          - image: grocery-tracker-scraper
            dockerfile: apps/grocery-scraper/Dockerfile
            changed: ${{ needs.changes.outputs.scraper }}
    steps:
      - name: Check out the release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Docker Buildx
        if: matrix.changed == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: matrix.changed == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image metadata
        if: matrix.changed == 'true'
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ vars.DOCKERHUB_USERNAME }}/${{ matrix.image }}
          tags: |
            type=raw,value=${{ github.event.release.tag_name }}
            type=raw,value=latest,enable=${{ !github.event.release.prerelease }}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.event.release.tag_name }}

      - name: Build and push image
        if: matrix.changed == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
